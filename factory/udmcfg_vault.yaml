info:
  description: UDM initial local configuration
  version: 1.0.0
configuration:
  nrfUri: http://localhost:29000
  enableNrfCaching: true
  nrfCacheEvictionInterval: 900
  sbi:
    bindingIPv4: "0.0.0.0"
    port: 29503
    registerIPv4: "172.28.31.5"
    scheme: http
    tls:
      log: /opt/sslkey.log
      key: /var/run/certs/tls.key
      pem: /var/run/certs/tls.pem
  serviceList:
    - nudm-sdm
    - nudm-uecm
    - nudm-ueau
    - nudm-ee
    - nudm-pp
  vault:
    vault-uri: "http://127.0.0.1:8200"
    enable: true
    tls-insecure: true
    
    # AppRole authentication
    role-id: "${VAULT_ROLE_ID}"
    secret-id: "${VAULT_SECRET_ID}"
    
    # Custom mount paths for auth methods (optional, uses defaults if not specified)
    approle-mount-path: "auth-dev-approle"  # Default: "approle"
    # k8s-mount-path: "kubernetes"   # Default: "kubernetes"
    cert-mount-path: "auth-dev-cert"        # Default: "cert"
    transit-keys-decrypt-path: "transit-dev/decrypt/%s"

  webuiUri: http://localhost:5001
  keys:
    udmProfileAHNPublicKey: 5a8d38864820197c3394b92613b20b91633cbd897119273bf8e4a6f4eec0a650
    udmProfileAHNPrivateKey: c53c22208b61860b06c62e5406a7b330c2b577aa5558981510d128247d38bd1d
    udmProfileBHNPublicKey: 0472DA71976234CE833A6907425867B82E074D44EF907DFB4B3E21C1C2256EBCD15A7DED52FCBB097A4ED250E036C7B9C8C7004C4EEDC4F068CD7BF8D3F900E3B4
    udmProfileBHNPrivateKey: F1AB1074477EBCC7F554EA1C5FC368B1616730155E0041AC447D6301975FECDA
  metricsPort: ":9101"
  
logger:
  AppLog:
    debugLevel: debug
  InitLog:
    debugLevel: debug
  CfgLog:
    debugLevel: debug
  Handlelog:
    debugLevel: debug
  HttpLog:
    debugLevel: debug
  UeauLog:
    debugLevel: debug
  UecmLog:
    debugLevel: debug
  SdmLog:
    debugLevel: debug
  PpLog:
    debugLevel: debug
  EeLog:
    debugLevel: debug
  UtilLog:
    debugLevel: debug
  CallbackLog:
    debugLevel: debug
  ConsumerLog:
    debugLevel: debug
  GinLog:
    debugLevel: debug
  ProducerLog:
    debugLevel: debug
  PollConfigLog:
    debugLevel: debug
  NrfRegistrationLog:
    debugLevel: debug
